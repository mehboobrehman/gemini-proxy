name: CI/CD Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  validate-and-build:
    name: Validate, Build Web Assets & Capacitor Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
            ~/.bun
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Dependencies
        run: |
          npm install

      - name: Build Web Assets
        run: |
          bun run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Android Debug & Release APKs
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease

      - name: Prepare Artifact Manifest
        id: manifest
        run: |
          mkdir -p build-artifacts
          
          # Copy APKs if they exist
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/app-debug.apk
            echo "DEBUG_APK=build-artifacts/app-debug.apk" >> $GITHUB_OUTPUT
          fi
          
          if [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-artifacts/app-release-unsigned.apk
            echo "RELEASE_APK=build-artifacts/app-release-unsigned.apk" >> $GITHUB_OUTPUT
          elif [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-artifacts/app-release-unsigned.apk
            echo "RELEASE_APK=build-artifacts/app-release-unsigned.apk" >> $GITHUB_OUTPUT
          fi

          # Extract version from package.json
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          
          # Generate artifact hash manifest
          echo "### Artifact Manifest" > artifact-manifest.md
          echo "| Artifact Name | SHA-256 Hash | File Size |" >> artifact-manifest.md
          echo "|---|---|---|" >> artifact-manifest.md
          
          for file in build-artifacts/*.apk; do
            if [ -f "$file" ]; then
              HASH=$(sha256sum "$file" | awk '{print $1}')
              SIZE=$(du -h "$file" | awk '{print $1}')
              FILENAME=$(basename "$file")
              echo "| \`$FILENAME\` | \`$HASH\` | $SIZE |" >> artifact-manifest.md
            fi
          done
          
          cat artifact-manifest.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gemini-proxy-apk-artifacts
          path: build-artifacts/*.apk

  release:
    name: Create GitHub Release & Attach Assets
    needs: validate-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: gemini-proxy-apk-artifacts
          path: downloaded-artifacts

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            downloaded-artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output Release Status
        run: |
          echo "Successfully created release for tag ${{ github.ref_name }}"
          echo "Release URL: ${{ steps.create_release.outputs.url }}"
